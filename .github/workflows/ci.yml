name: app

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name : afficher un message
        run: echo 'Début du pipeline CI/CD'
        
      - name: Copier le code source
        uses: actions/checkout@v4
        

      - name: Créer un fichier qui servira d'artefact
        run: echo 'Ceci est un artefact' > artifact.txt

      - name: publier le fichier en tant qu'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Artefact
          path: artifact.txt